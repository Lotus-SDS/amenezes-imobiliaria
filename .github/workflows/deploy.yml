# Publica o site a cada push na main: confere o build e roda no servidor o mesmo comando do deploy manual.
# Configuração única (chave, secrets, usuário): README, seção "Publicação automática".
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# dois "compose up" ao mesmo tempo já brigaram pelo nome do container: um deploy por vez, o mais novo espera
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/amenezes-imobiliaria' }}
      URL: https://lotusdev.com.br/amenezes-imobiliaria/
    steps:
      - name: Chave SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Atualizar e subir no servidor
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o BatchMode=yes "$TARGET" bash -s -- "$DEPLOY_PATH" <<'SH'
          set -euo pipefail
          cd "$1"
          git pull --ff-only
          docker compose -f deploy/compose.yml up -d --build
          # o healthcheck do Dockerfile roda a cada 30 s: até 3 min para o container novo ficar saudável
          for i in $(seq 36); do
            s=$(docker inspect -f '{{.State.Health.Status}}' amenezes-app-1)
            echo "container: $s"
            [ "$s" = healthy ] && exit 0
            [ "$s" = unhealthy ] && break
            sleep 5
          done
          docker compose -f deploy/compose.yml logs --tail 50 app
          exit 1
          SH

      - name: Site responde
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$URL" || true)
          echo "HTTP $code"
          [ "$code" = 200 ]
